<div class="max-w-7xl mx-auto px-4 py-8">
  <div class="flex flex-col lg:flex-row gap-8">
    <!-- Thumbnails & Main Image Section -->
    <div class="flex flex-col-reverse lg:flex-row gap-4 flex-1">
      <div class="flex lg:flex-col gap-3 overflow-x-auto">
        @for (src of imageSources; track src; let index = $index) {
          <div
            class="w-20 h-20 rounded-lg border-2 cursor-pointer overflow-hidden transition-all"
            [class.border-blue-600]="index === activeIndex"
            [class.border-gray-200]="index !== activeIndex"
            (click)="handleItemClick(index)"
          >
            <img [src]="src" [alt]="'Product ' + (index + 1)" class="w-full h-full object-cover" />
          </div>
        }
      </div>
      <div
        class="flex-1 main-item bg-gray-50 rounded-xl overflow-hidden border border-gray-100 flex items-center justify-center p-4"
      >
        <img
          [src]="imageSources[activeIndex]"
          alt="Active Product"
          class="max-h-[450px] object-contain transition-transform duration-300"
        />
      </div>
    </div>

    <!-- Product Information Section -->
    <div class="flex-1 flex flex-col gap-6">
      <div class="flex justify-between items-start">
        <h1 class="text-2xl lg:text-3xl font-bold text-gray-900 leading-snug">
          AORUS GeForce RTX™ 4080 16GB XTREME WATERFORCE WB
        </h1>
        <button
          class="p-3 rounded-full bg-gray-50 hover:bg-gray-100 text-gray-600 transition shadow-sm"
        >
          <span class="solar--heart-outline text-xl"></span>
        </button>
      </div>

      <div class="flex items-center gap-2">
        <div class="flex text-yellow-400 gap-1 cursor-pointer">
          @for (star of [1, 2, 3, 4, 5]; track star; let i = $index) {
            <span
              (click)="handleStarClick(i + 1)"
              class="text-xl"
              [class.text-gray-300]="i >= rating"
            >
              <span class="mage--star-fill"></span>
            </span>
          }
        </div>
        <span class="text-sm text-gray-500 font-medium">({{ totalRatings }}) reviews</span>
      </div>

      <div class="bg-gray-50 p-4 rounded-xl border border-gray-100">
        <p class="text-sm text-gray-500 mb-1 font-medium">Price:</p>
        <p class="text-3xl font-bold text-blue-600">$1499.00</p>
      </div>

      <button
        class="w-full py-4 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700 transition shadow-md"
      >
        Add to Cart
      </button>
    </div>
  </div>
</div>
