<header class="relative w-full h-[4.5rem] md:h-14 flex items-center z-[99]">
  <a routerLink="/"
    ><img
      src="/images/logo.webp"
      alt="Logo"
      class="w-20 max-md:w-24 max-sm:w-28 aspect-[2.5/1] object-contain"
  /></a>

  <ul class="ml-[1.2rem] max-md:hidden flex items-center">
    @for (item of navItems; track item.path) {
      <li
        class="list-none inline-block px-2 uppercase font-sans font-light text-[0.5rem] max-lg:text-[0.6rem]"
      >
        <a
          [routerLink]="item.path"
          routerLinkActive="!text-[var(--primary-color)]"
          class="no-underline text-[var(--text-color)] transition duration-500 hover:text-[var(--primary-color)]"
          >{{ item.label }}</a
        >
      </li>
    }
  </ul>
</header>
